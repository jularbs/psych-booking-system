<form [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <label for="slug">Slug:</label>
    <input id="slug" type="text" formControlName="slug" />
  </div>
  <div>
    <label for="name">Name:</label>
    <input id="name" type="text" formControlName="name" />
  </div>
  <div>
    <label for="description">Description:</label>
    <textarea id="description" formControlName="description"></textarea>
  </div>
  <div>
    <label for="price_amount">Price:</label>
    <input id="price_amount" type="number" step=".01" formControlName="price_amount" />
  </div>
  <div>
    <label for="currency">Currency:</label>
    <input id="currency" type="text" formControlName="currency" />
  </div>
  <div>
    <label for="duration_minutes">Duration (in minutes):</label>
    <input id="duration_minutes" type="number" formControlName="duration_minutes" />
  </div>
  <div>
    <label for="is_active">Is Active:</label>
    <input id="is_active" type="checkbox" formControlName="is_active" />
  </div>
  <div>
    <button type="submit" [disabled]="isSubmitting()">Save</button>
    <button type="button" (click)="onCancel()">Cancel</button>
  </div>
</form>
